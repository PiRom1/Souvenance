{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>{% block title %}Souvenance{% endblock %}</title>
    <link rel="preload" href="{% static 'timeline/fonts/cormorant-garamond-300-italic.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{% static 'timeline/css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'timeline/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'timeline/css/avatars.css' %}">
    <link rel="stylesheet" href="{% static 'timeline/css/timeline.css' %}">
    <link rel="stylesheet" href="{% static 'timeline/css/book.css' %}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="sv-backdrop" aria-hidden="true">
        <div class="sv-backdrop__trace sv-backdrop__trace--bordeaux"></div>
        <div class="sv-backdrop__trace sv-backdrop__trace--gold"></div>
        <div class="sv-backdrop__trace sv-backdrop__trace--ink"></div>
        <div class="sv-backdrop__grain"></div>
    </div>

    <header class="sv-nav">
        <a class="sv-nav__brand" href="{% url 'home' %}">Souvenance</a>
        {% if user.is_authenticated %}
            <a class="sv-btn" href="{% url 'moment_add' %}">Nouveau moment</a>
            <div class="sv-nav__user">
                <img class="sv-nav__face" src="{% static 'timeline/img/'|add:user.username|add:'.png' %}" alt="" onerror="this.remove()">
                {{ user }}
            </div>
            <form class="sv-nav__logout" method="post" action="{% url 'logout' %}">
                {% csrf_token %}<button class="sv-btn sv-btn--link" type="submit">Se déconnecter</button>
            </form>
        {% endif %}
    </header>

    <main class="sv-page {% block page_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
